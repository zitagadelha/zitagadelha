<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, max-snippet:0, max-image-preview:none">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css?v=6">
  <link rel="icon" href="/IMG/logo.webp" type="image/webp">
</head>
<body class="admin-email">

  <div id="login-view" class="admin-email__login-screen">
    <main class="admin-email__login-card">
      <span class="admin-email__login-beam" aria-hidden="true"></span>

      <div class="admin-email__login-inner">
        <header class="admin-email__login-header">
          <h1>Login</h1>
          <p>Entre com suas credenciais para acessar a lista de inscritos da newsletter.</p>
        </header>

        <div class="admin-email__alert" id="admin-login-error" hidden></div>

        <form id="admin-login-form" class="admin-email__login-form">
          <div class="admin-email__field">
            <label for="admin-login-email">E-mail</label>
            <input
              type="email"
              id="admin-login-email"
              name="email"
              placeholder="seu@email.com"
              autocomplete="username"
              required
            >
          </div>

          <div class="admin-email__field">
            <label for="admin-login-password">Senha</label>
            <div class="admin-email__password-wrap">
              <input
                type="password"
                id="admin-login-password"
                name="password"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                class="admin-email__password-toggle"
                id="admin-password-toggle"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg class="admin-email__icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="admin-email__icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-6.94"/>
                  <path d="M1 1l22 22"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="btn admin-email__login-btn" type="submit">Entrar</button>
        </form>
      </div>
    </main>
  </div>

  <div id="dashboard-view" hidden>
    <header class="admin-email__header">
      <div>
        <strong>Newsletter</strong>
        <span id="admin-count">0 inscritos no período</span>
      </div>
      <button class="admin-email__logout" type="button" id="admin-logout">Sair</button>
    </header>

    <main class="admin-email__main">
      <form class="admin-email__filters" id="admin-filter-form">
        <label class="admin-email__field" for="admin-search">
          Buscar e-mail
          <input type="search" id="admin-search" name="busca" placeholder="ex.: gmail.com">
        </label>

        <label class="admin-email__field" for="admin-period">
          Período
          <select id="admin-period" name="periodo">
            <option value="7">Últimos 7 dias</option>
            <option value="14">Últimos 14 dias</option>
            <option value="30" selected>Últimos 30 dias</option>
            <option value="personalizado">Personalizado</option>
          </select>
        </label>

        <label class="admin-email__field" for="admin-start">
          Início
          <input type="date" id="admin-start" name="inicio" disabled>
        </label>

        <label class="admin-email__field" for="admin-end">
          Fim
          <input type="date" id="admin-end" name="fim" disabled>
        </label>

        <button class="btn" type="submit">Filtrar</button>
      </form>

      <div class="admin-email__export">
        <button class="btn" type="button" id="export-csv">Exportar CSV</button>
        <button class="btn" type="button" id="export-xlsx">Exportar XLSX</button>
        <button class="btn" type="button" id="export-pdf">Exportar PDF</button>
      </div>

      <div class="admin-email__table-wrap">
        <table class="admin-email__table">
          <thead>
            <tr>
              <th>E-mail</th>
              <th>Página</th>
              <th>Cadastro</th>
            </tr>
          </thead>
          <tbody id="admin-table-body">
            <tr>
              <td colspan="3" class="admin-email__empty">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js?v=5"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js" defer></script>
  <script src="/js/admin-email.js?v=6" defer></script>
</body>
</html>
